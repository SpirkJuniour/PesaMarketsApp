{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto py-6 sm:py-10">

    <!-- Card Container -->
    <div class="bg-white dark:bg-dark-850 rounded-3xl border border-[#DDDDDD] dark:border-dark-750 p-7 sm:p-9 shadow-card relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto mb-3.5 rounded-full bg-gradient-to-tr from-[#4169E1] to-[#2D4AAF] flex items-center justify-center text-white shadow-brand-glow">
                <i class="fas fa-key text-xl"></i>
            </div>
            <h1 class="text-2xl font-black text-neutral-900 dark:text-white tracking-tight">Change Security Password</h1>
            <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-1">Update your trader account password</p>
        </div>

        <!-- Password Change Form -->
        <form method="POST" action="{% url 'password_change' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="id_old_password" class="block text-xs font-bold text-neutral-700 dark:text-neutral-300 mb-1.5">
                    Current Password
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                        <i class="fas fa-lock text-xs"></i>
                    </div>
                    <input type="password" 
                           id="id_old_password" 
                           name="old_password" 
                           required 
                           autocomplete="current-password"
                           placeholder="••••••••"
                           class="w-full pl-9 pr-4 py-2.5 rounded-full bg-neutral-50 dark:bg-dark-800 border border-[#DDDDDD] dark:border-dark-700 text-neutral-900 dark:text-white text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-[#4169E1] focus:border-transparent transition-all font-mono">
                </div>
            </div>

            <div>
                <label for="id_new_password" class="block text-xs font-bold text-neutral-700 dark:text-neutral-300 mb-1.5">
                    New Password (min 8 characters)
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                        <i class="fas fa-shield-alt text-xs"></i>
                    </div>
                    <input type="password" 
                           id="id_new_password" 
                           name="new_password" 
                           minlength="8"
                           required 
                           autocomplete="new-password"
                           placeholder="••••••••"
                           class="w-full pl-9 pr-4 py-2.5 rounded-full bg-neutral-50 dark:bg-dark-800 border border-[#DDDDDD] dark:border-dark-700 text-neutral-900 dark:text-white text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-[#4169E1] focus:border-transparent transition-all font-mono">
                </div>
            </div>

            <div>
                <label for="id_confirm_new_password" class="block text-xs font-bold text-neutral-700 dark:text-neutral-300 mb-1.5">
                    Confirm New Password
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                        <i class="fas fa-check-double text-xs"></i>
                    </div>
                    <input type="password" 
                           id="id_confirm_new_password" 
                           name="confirm_new_password" 
                           minlength="8"
                           required 
                           autocomplete="new-password"
                           placeholder="••••••••"
                           class="w-full pl-9 pr-4 py-2.5 rounded-full bg-neutral-50 dark:bg-dark-800 border border-[#DDDDDD] dark:border-dark-700 text-neutral-900 dark:text-white text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-[#4169E1] focus:border-transparent transition-all font-mono">
                </div>
            </div>

            <div class="pt-3">
                <button type="submit" 
                        class="w-full py-3 px-4 rounded-full bg-[#4169E1] hover:bg-[#3457C9] text-white font-extrabold text-xs shadow-brand-glow hover:shadow-lg transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-save text-xs"></i>
                    <span>Update Security Password</span>
                </button>
            </div>
        </form>

        <div class="mt-6 pt-4 border-t border-[#EBEBEB] dark:border-dark-750 flex items-center justify-between text-xs">
            <a href="{% url 'settings' %}" class="font-bold text-[#4169E1] hover:underline flex items-center gap-1.5">
                <i class="fas fa-arrow-left text-[10px]"></i> Back to Settings
            </a>
            <a href="{% url 'profile' %}" class="text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200">
                View Account Profile
            </a>
        </div>

    </div>

</div>
{% endblock %}
