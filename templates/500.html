{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto py-12 sm:py-20 text-center">
    <div class="w-20 h-20 mx-auto mb-6 rounded-3xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 flex items-center justify-center text-3xl font-black shadow-xs">
        <i class="fas fa-triangle-exclamation"></i>
    </div>
    
    <span class="text-xs font-mono font-bold tracking-widest uppercase px-3 py-1 rounded-full bg-rose-100/60 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 mb-3 inline-block">
        500 &bull; Server Telemetry Warning
    </span>

    <h1 class="text-3xl sm:text-4xl font-black text-neutral-900 dark:text-white tracking-tight mt-1 mb-3">
        System Synchronization Delay
    </h1>
    
    <p class="text-xs sm:text-sm text-neutral-500 dark:text-neutral-400 max-w-md mx-auto mb-8">
        Our core matching engine encountered a temporary synchronization anomaly. Our automated telemetry engineers have been notified.
    </p>

    <div class="flex flex-wrap items-center justify-center gap-3">
        <a href="{% url 'home' %}" 
           class="px-6 py-3 rounded-full bg-[#4169E1] hover:bg-[#3457C9] text-white font-extrabold text-xs shadow-brand-glow transition-all flex items-center gap-2">
            <i class="fas fa-arrow-rotate-right text-xs"></i>
            <span>Refresh Application</span>
        </a>
        <a href="{% url 'support' %}" 
           class="px-6 py-3 rounded-full bg-neutral-100 dark:bg-dark-800 hover:bg-neutral-200 dark:hover:bg-dark-750 text-neutral-900 dark:text-white font-bold text-xs transition-colors">
            Contact Support Desk
        </a>
    </div>
</div>
{% endblock %}
