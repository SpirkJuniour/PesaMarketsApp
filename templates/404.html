{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto py-12 sm:py-20 text-center">
    <div class="w-20 h-20 mx-auto mb-6 rounded-3xl bg-[#EBF0FF] dark:bg-[#4169E1]/15 text-[#4169E1] flex items-center justify-center text-3xl font-black shadow-brand-glow">
        <i class="fas fa-compass"></i>
    </div>
    
    <span class="text-xs font-mono font-bold tracking-widest uppercase px-3 py-1 rounded-full bg-neutral-100 dark:bg-dark-750 text-neutral-500 mb-3 inline-block">
        404 &bull; Page Not Found
    </span>

    <h1 class="text-3xl sm:text-4xl font-black text-neutral-900 dark:text-white tracking-tight mt-1 mb-3">
        Market Route Unavailable
    </h1>
    
    <p class="text-xs sm:text-sm text-neutral-500 dark:text-neutral-400 max-w-md mx-auto mb-8">
        The financial instrument, trading desk, or link you are seeking is unavailable or has moved to a new ticker identifier.
    </p>

    <div class="flex flex-wrap items-center justify-center gap-3">
        <a href="{% url 'home' %}" 
           class="px-6 py-3 rounded-full bg-[#4169E1] hover:bg-[#3457C9] text-white font-extrabold text-xs shadow-brand-glow transition-all flex items-center gap-2">
            <i class="fas fa-home text-xs"></i>
            <span>Return to Dashboard</span>
        </a>
        <a href="{% url 'markets' %}" 
           class="px-6 py-3 rounded-full bg-neutral-100 dark:bg-dark-800 hover:bg-neutral-200 dark:hover:bg-dark-750 text-neutral-900 dark:text-white font-bold text-xs transition-colors">
            Browse Market Catalog
        </a>
    </div>
</div>
{% endblock %}
